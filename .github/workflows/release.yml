name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      keep_artifacts:
        description: "Upload binaries as workflow artifacts (always done for non-tag runs)"
        required: false
        default: "true"

permissions:
  contents: write

env:
  GO_VERSION: "1.23.9"

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          case "$VER" in v*) ;; *) VER="dev-$VER";; esac
          SHORT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          out="dist/whpaper-${VER}-${GOOS}-${GOARCH}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VER} -X main.commit=${SHORT} -X main.date=${DATE}" \
            -o "$out" .
          ( cd dist && tar czf "$(basename "$out").tar.gz" "$(basename "$out")" )
          rm -f "$out"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: whpaper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "$GITHUB_REF_NAME" \
              --notes "Random wallhaven wallpapers for Noctalia. Install: curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/scripts/install.sh | bash"
          fi
          gh release list --limit 5
